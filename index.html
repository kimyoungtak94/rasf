<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Creative Agent Team</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #e6f0ff, #f8fbff);
      color: #1f2937;
    }

    .wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .hero {
      text-align: center;
      padding: 50px 20px 30px;
    }

    .hero h1 {
      margin: 0;
      font-size: 36px;
      font-weight: 700;
      color: #0f172a;
    }

    .hero p {
      margin-top: 12px;
      font-size: 18px;
      color: #475569;
    }

    .chat-section {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: stretch;
      padding: 20px;
    }

    .chat-card {
      width: 100%;
      max-width: 1100px;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .chat-header {
      background: #0f4c81;
      color: white;
      padding: 18px 24px;
      font-size: 20px;
      font-weight: bold;
    }

    .chat-body {
      height: 75vh;
      min-height: 600px;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    .footer {
      text-align: center;
      padding: 16px;
      font-size: 14px;
      color: #64748b;
    }

    @media (max-width: 768px) {
      .hero h1 {
        font-size: 28px;
      }

      .hero p {
        font-size: 16px;
      }

      .chat-body {
        height: 70vh;
        min-height: 500px;
      }

      .chat-header {
        font-size: 18px;
      }
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="hero">
      <h1>AI Creative Agent Team</h1>
      <p>궁금한 점을 질문하면 AI 에이전트가 도와드립니다.</p>
    </div>

    <div class="chat-section">
      <div class="chat-card">
        <div class="chat-header">💬 AI 챗봇 상담</div>
        <div class="chat-body">
          <iframe
            src="https://copilotstudio.microsoft.com/environments/Default-9ef36566-f756-4f11-9c5f-307c10f409f9/bots/cre46_aicreativeagentteam_IroZH1/webchat?__version__=2&enableFileAttachment=false&cliAgent=true"
            frameborder="0">
          </iframe>
        </div>
      </div>
    </div>

    <div class="footer">
      © 2026 AI Creative Agent Team. All rights reserved.
    </div>
  </div>
</body>
</html>
